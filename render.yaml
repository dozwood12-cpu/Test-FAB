# Creates paid services only after the owner reviews and confirms in Render.
# See docs/RENDER.md before deploying.
databases:
  - name: anargya-fab-db
    databaseName: fab
    user: fab
    plan: basic-256mb
    region: singapore

services:
  - type: web
    name: anargya-fab
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/health
    disk:
      name: fab-documents
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: anargya-fab-db
          property: connectionString
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
